<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yoojin Choi — Design Lead</title>
    <meta
      name="description"
      content="Yoojin Choi — Digital Manager & Design Lead. Product Design, UX/UI, AX Design."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        background: #f7f7fb;
      }
      body {
        position: relative;
        overflow-x: hidden;
      }
      /* Fixed atmospheric field behind the scrolling content. */
      .ripple-host {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      .ripple-host canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #react-root {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="ripple-host" class="ripple-host" aria-hidden="true"></div>
    <div id="react-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
